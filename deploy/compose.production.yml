name: navpilot

services:
  app:
    build:
      context: "${NAVPILOT_RELEASE_PATH:-..}"
      dockerfile: Dockerfile
      target: runtime
    image: "${NAVPILOT_APP_IMAGE:-navpilot:production}"
    container_name: navpilot-app
    restart: unless-stopped
    init: true
    env_file:
      - "${NAVPILOT_SERVER_ENV_PATH:-../config/server.env}"
    environment:
      NODE_ENV: production
      PORT: "8787"
      NAVPILOT_DB_PATH: /app/server/data/navpilot.db
      NAVPILOT_DB_DRIVER: postgres
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-navpilot}"
      NAVPILOT_ENABLE_CRON: "false"
      NAVPILOT_GEOIP_DB_PATH: /app/geoip/GeoLite2-Country.mmdb
      NAVPILOT_GEOIP_CITY_DB_PATH: /app/geoip/geolite2-city-ipv4.mmdb
      NAVPILOT_TRUST_PROXY: uniquelocal
    volumes:
      - "${NAVPILOT_DATA_PATH:-../data}:/app/server/data"
      - "${NAVPILOT_GEOIP_PATH:-../geoip}:/app/geoip:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 20s
    logging: &logging
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  edge:
    build:
      context: "${NAVPILOT_RELEASE_PATH:-..}"
      dockerfile: Dockerfile
      target: edge
    image: "${NAVPILOT_EDGE_IMAGE:-navpilot-edge:production}"
    container_name: navpilot
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    volumes:
      - "${NAVPILOT_EDGE_CONFIG_PATH:-./nginx.production.conf}:/etc/nginx/nginx.conf:ro"
    networks:
      backend: {}
      npm_proxy:
        aliases: [navpilot]
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=16m
      - /var/run:size=1m
    cap_drop: [ALL]
    cap_add: [CHOWN, SETGID, SETUID]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  worker:
    image: "${NAVPILOT_APP_IMAGE:-navpilot:production}"
    container_name: navpilot-worker
    restart: unless-stopped
    init: true
    command: ["node", "src/worker.js"]
    healthcheck:
      disable: true
    env_file:
      - "${NAVPILOT_SERVER_ENV_PATH:-../config/server.env}"
    environment:
      NODE_ENV: production
      NAVPILOT_DB_PATH: /app/server/data/navpilot.db
      NAVPILOT_DB_DRIVER: postgres
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-navpilot}"
      NAVPILOT_ENABLE_CRON: "true"
    volumes:
      - "${NAVPILOT_DATA_PATH:-../data}:/app/server/data"
      - "${NAVPILOT_GEOIP_PATH:-../geoip}:/app/geoip:ro"
    depends_on:
      postgres:
        condition: service_healthy
    networks: [backend, egress]
    read_only: true
    tmpfs:
      - /tmp:size=16m,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    logging: *logging

  postgres:
    image: postgres:16-alpine
    container_name: navpilot-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-navpilot}"
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - "${NAVPILOT_POSTGRES_PATH:-../postgres}:/var/lib/postgresql/data"
    networks: [backend]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
    shm_size: 256mb
    logging: *logging

networks:
  backend:
    internal: true
  egress:
    driver: bridge
  npm_proxy:
    external: true
